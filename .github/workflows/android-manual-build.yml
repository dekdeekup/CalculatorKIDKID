name: Android manual test build

on:
  workflow_dispatch:

# No release publishing, repository writes, secrets, or production signing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          test -n "$ANDROID_HOME"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          python3 -c 'print("y\n" * 200)' | "$sdk_manager" --sdk_root="$ANDROID_HOME" --licenses
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
          java -version
          ./gradlew --version

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK and unsigned release bundle
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:bundleRelease

      - name: Verify signatures and absence of application permissions
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import subprocess
          import zipfile
          import os
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          aapt = os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/aapt'
          permissions = subprocess.check_output([aapt, 'dump', 'permissions', apk], text=True)
          if 'uses-permission' in permissions:
              raise SystemExit('Unexpected application permission; do not deliver.')
          with zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle:
              if any(name.upper().startswith('META-INF/') and name.upper().endswith(('.RSA', '.DSA', '.EC', '.SF')) for name in bundle.namelist()):
                  raise SystemExit('Release bundle unexpectedly signed; unsigned output required.')
          PY

      - name: Package and scan deliverables
        run: python3 .github/scripts/package-artifacts.py

      - name: Upload downloadable test deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CalculatorKidKid-0.1.0-test-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CalculatorKidKid-failure-reports-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
